name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.111" "uvicorn[standard]>=0.30" "httpx>=0.27,<1" "anthropic>=0.40,<1"
      - name: Run unit tests
        run: python -m unittest tests.test_proxy tests.test_pool -v
